name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5
          cache: true

      # Generates the standard Gradle/Android scaffolding around our own files.
      # Existing files (manifest, Kotlin code, lib/) are left untouched.
      - name: Generate Android scaffolding
        run: |
          flutter create --project-name household_ledger --org com.assem --platforms android .
          rm -f test/widget_test.dart   # template test refers to the counter demo app
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] && sed -i -E 's/minSdk(Version)? *=? *flutter\.minSdkVersion/minSdk = 23/' "$f" || true
          done
          grep -n "minSdk" android/app/build.gradle* || true

      - name: Use the permanent signing key
        env:
          LEDGER_KEY_PASSWORD: ${{ secrets.LEDGER_KEY_PASSWORD }}
        run: python3 tool/apply_signing.py

      - run: flutter pub get

      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1
          code=$?
          cat analyze.txt
          if [ $code -ne 0 ]; then
            for chunk in 0 1 2 3 4 5 6 7; do
              msg=$(grep -E "^ *error" analyze.txt | sed -n "$((chunk*8+1)),$((chunk*8+8))p" | sed 's/^ *error • //' | awk 'BEGIN{ORS="%0A"}{print}')
              [ -n "$msg" ] && echo "::error::$msg"
            done
          fi
          exit $code

      - name: Test SMS parser and periods
        run: |
          set +e
          flutter test > test.txt 2>&1
          code=$?
          cat test.txt
          if [ $code -ne 0 ]; then
            grep -E "Expected|Actual|\[E\]|Error" test.txt | head -30 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit $code

      - name: Build release APK
        env:
          LEDGER_KEY_PASSWORD: ${{ secrets.LEDGER_KEY_PASSWORD }}
          LEDGER_KEYSTORE: ${{ github.workspace }}/signing/household-ledger-release.p12
        run: |
          set +e
          flutter build apk --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }} > build.txt 2>&1
          code=$?
          cat build.txt
          if [ $code -ne 0 ]; then
            grep -E "^e: |error:|Error:|What went wrong" -A2 build.txt | head -30 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit $code

      - name: Check the APK signature
        env:
          HAS_KEY: ${{ secrets.LEDGER_KEY_PASSWORD != '' }}
        run: |
          mkdir -p sig && cd sig && unzip -o -q ../build/app/outputs/flutter-apk/app-release.apk 'META-INF/*.RSA'
          fp=$(openssl pkcs7 -inform DER -in META-INF/*.RSA -print_certs | openssl x509 -noout -fingerprint -sha256 | cut -d= -f2)
          echo "Signed with: $fp"
          sha1=$(openssl pkcs7 -inform DER -in META-INF/*.RSA -print_certs | openssl x509 -noout -fingerprint -sha1 | cut -d= -f2)
          printf 'Signing certificate (for Firebase / Google sign-in)\n\n- SHA-1: `%s`\n- SHA-256: `%s`\n- Package: `com.assem.household_ledger`\n' "$sha1" "$fp" > ../release-notes.md
          cat ../release-notes.md
          expected="62:32:10:88:AD:57:EE:AA:1F:D3:EC:6A:AE:0C:24:2D:20:92:59:47:6B:D4:42:DC:9B:99:7A:22:9B:28:D4:A7"
          if [ "$HAS_KEY" = "true" ] && [ "$fp" != "$expected" ]; then
            echo "::error::APK is not signed with the permanent key"; exit 1
          fi

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: shahri-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish as a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Shahri build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
          body_path: release-notes.md
