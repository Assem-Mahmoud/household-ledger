name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5
          cache: true

      # Generates the standard Gradle/Android scaffolding around our own files.
      # Existing files (manifest, Kotlin code, lib/) are left untouched.
      - name: Generate Android scaffolding
        run: |
          flutter create --project-name household_ledger --org com.assem --platforms android .
          rm -f test/widget_test.dart   # template test refers to the counter demo app
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] && sed -i -E 's/minSdk(Version)? *=? *flutter\.minSdkVersion/minSdk = 23/' "$f" || true
          done
          grep -n "minSdk" android/app/build.gradle* || true

      - run: flutter pub get

      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1
          code=$?
          cat analyze.txt
          if [ $code -ne 0 ]; then
            grep -E "^ *error" analyze.txt | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit $code

      - name: Test SMS parser and periods
        run: |
          set +e
          flutter test > test.txt 2>&1
          code=$?
          cat test.txt
          if [ $code -ne 0 ]; then
            grep -E "Expected|Actual|\[E\]|Error" test.txt | head -30 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit $code

      - name: Build release APK
        run: |
          set +e
          flutter build apk --release > build.txt 2>&1
          code=$?
          cat build.txt
          if [ $code -ne 0 ]; then
            grep -E "^e: |error:|Error:|What went wrong" -A2 build.txt | head -30 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit $code

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: household-ledger-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish as a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Household Ledger build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
